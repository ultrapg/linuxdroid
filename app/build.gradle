plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def signingPropsPath = System.getenv('LINUXDROID_SIGNING_PROPS')
    ?: "${System.getProperty('user.home')}/.local/share/linuxdroid-signing/signing.properties"
def signingPropsFile = new File(signingPropsPath)
def signingProps = new Properties()
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.linuxdroid.app'
    compileSdk 35
    ndkVersion project.findProperty('ndkVersion') ?: '27.2.12479018'

    defaultConfig {
        applicationId "com.linuxdroid.app"
        minSdk 26
        // Target SDK 28 preserves Android SELinux untrusted_app_27 execution & background workstation permissions
        // required by PRoot, FEX-Emu JIT, PulseAudio, and VirGL/Venus render server across Android 9-15+.
        targetSdk 28
        versionCode 2
        versionName "1.0.1"

        buildConfigField "String", "CATALOG_URL", "\"https://github.com/ultrapg/linuxdroid/releases/latest/download/catalog.json\""
        buildConfigField "String", "GITHUB_REPO", "\"ultrapg/linuxdroid\""

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (signingPropsFile.isFile() && signingProps.getProperty('storeFile')) {
                storeFile file(signingProps.getProperty('storeFile'))
                storeType "PKCS12"
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (signingPropsFile.isFile() && signingProps.getProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libtermux.so', '**/libc++_shared.so']
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.termux.termux-app:terminal-view:0.118.0'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'com.github.luben:zstd-jni:1.5.7-4@jar'
}
